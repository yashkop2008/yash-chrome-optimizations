<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yash's Chrome</title>
    <link rel="stylesheet" href="../core/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="../icons/48.png" alt="" width="18" height="18" />
        <span>Yash's Chrome</span>
      </div>
      <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
    </header>

    <section class="update" id="update" hidden>
      <div>
        <div class="update-title" id="update-title">Update ready</div>
        <div class="update-desc">One click, no re-downloading.</div>
      </div>
      <button class="btn-light" id="update-open" type="button">Install</button>
    </section>

    <div id="sites"></div>
    <p class="empty-hub" id="empty" hidden>Every feature is switched off. Turn some on in Settings.</p>

    <p class="links">
      <span class="mono" id="ver"></span> ·
      <button class="link" id="open-settings" type="button">Settings</button> ·
      <button class="link" id="open-updates" type="button">Updates</button>
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
