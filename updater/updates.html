<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Updates</title>
    <link rel="stylesheet" href="updates.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img id="icon" alt="" width="18" height="18" />
        <span id="ext-name">Extension</span>
        <span class="crumb">Updates</span>
      </div>
      <span class="mono muted" id="checked"></span>
    </header>

    <main>
      <section class="status" aria-live="polite">
        <div class="version-row">
          <div>
            <div class="label" id="status-label">Installed</div>
            <div class="version mono" id="version">0.0.0</div>
          </div>
          <div class="actions">
            <button class="btn-ghost" id="check" type="button">Check now</button>
            <button class="btn-light" id="install" type="button" hidden>Install</button>
          </div>
        </div>
        <p class="message" id="message"></p>
        <div class="progress" id="progress" hidden>
          <div class="track"><div class="fill" id="fill"></div></div>
          <div class="step mono" id="step"></div>
        </div>
        <ul class="notes" id="notes" hidden></ul>
      </section>

      <section class="group" aria-labelledby="src-title">
        <div class="group-title" id="src-title">Where updates come from</div>
        <form id="config" autocomplete="off">
          <label class="row">
            <span class="row-text">
              <span class="row-title">GitHub repository</span>
              <span class="row-desc">owner/name, for example sam/chrome-extensions</span>
            </span>
            <input class="field" name="repo" placeholder="you/chrome-extensions" spellcheck="false" />
          </label>
          <label class="row">
            <span class="row-text">
              <span class="row-title">Folder in the repo</span>
              <span class="row-desc">Where manifest.json lives. Empty if it is at the top.</span>
            </span>
            <input class="field" name="path" placeholder="empty: the repo root" spellcheck="false" />
          </label>
          <label class="row">
            <span class="row-text">
              <span class="row-title">Branch</span>
            </span>
            <input class="field" name="branch" placeholder="main" spellcheck="false" />
          </label>
          <label class="row">
            <span class="row-text">
              <span class="row-title">Access token</span>
              <span class="row-desc">Only for a private repo. Read-only access is enough. Stays in this browser.</span>
            </span>
            <input class="field" name="token" type="password" placeholder="optional" spellcheck="false" />
          </label>
        </form>
        <div class="row">
          <span class="row-text">
            <span class="row-title">Extension folder</span>
            <span class="row-desc" id="folder-desc">The folder you picked in “Load unpacked”. Linked once, then reused.</span>
          </span>
          <button class="btn-outline" id="pick" type="button">Choose folder…</button>
        </div>
      </section>
    </main>

    <script type="module" src="updates.js"></script>
  </body>
</html>
